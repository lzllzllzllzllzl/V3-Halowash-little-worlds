<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<meta name="description" content="L Pro 四场景小世界：居家护理、病房护理、养老院护理与头皮沙龙四座微缩建筑，可旋转查看，点击进入实况场景。">
<title>L Pro 四场景小世界</title><script>window.addEventListener("error",function(e){document.title="ERR:"+e.message+" @line"+(e.lineno||"?");});window.addEventListener("unhandledrejection",function(e){var r=e.reason||{};document.title="REJ:"+r.message+" @ "+String(r.stack||"").split("\n")[1];});</script>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef0f2;overscroll-behavior:none}body{font-family:system-ui,sans-serif}
#world{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:grab;opacity:0;transition:opacity .6s ease}
#world.ready{opacity:1}#world.dragging{cursor:grabbing}#world:focus-visible{outline:1px solid #00000040;outline-offset:-5px}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 58%,rgba(60,70,80,.10) 100%)}
#loading{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px;border:1px solid #00000018;border-top-color:#00000066;border-radius:50%;animation:turn 1s linear infinite}
#fallback{position:absolute;inset:0;place-content:center;text-align:center;padding:30px;color:#3a4046;background:#eef0f2;font-size:16px;line-height:1.8}
#fallback:not([hidden]){display:grid}
#fallback p{max-width:380px;margin:auto}
.hud-top{position:fixed;top:max(14px,env(safe-area-inset-top));right:16px;z-index:10;display:flex;gap:8px}
.chip{border:1px solid #dfe3e7;border-radius:999px;background:#fffffff2;color:#3a4046;font:600 13px/1.5 system-ui,sans-serif;padding:8px 14px;text-decoration:none;display:inline-block}
.chip-btn{cursor:pointer}
.chip-btn:hover{background:#f3f5f6}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* permanent brand block, top-left (L'Oréal Paris · L Pro) */
.brand{position:fixed;top:max(24px,env(safe-area-inset-top));left:28px;z-index:10;pointer-events:none;user-select:none;color:#17191c}
.brand .loreal{margin:0;font:600 17px/1 'Optima','Candara','Trebuchet MS',Georgia,serif;letter-spacing:.12em;color:#101214}
.brand .paris{margin:4px 0 0;font:600 10px/1 'Optima','Candara','Trebuchet MS',Georgia,serif;letter-spacing:.46em;color:#101214}
.brand .title{margin:16px 0 0;font:200 46px/1 'Segoe UI','Helvetica Neue',system-ui,sans-serif;letter-spacing:.005em;color:#141619}
.brand .sub{margin:12px 0 0;font:500 15px/1 system-ui,'Microsoft YaHei',sans-serif;letter-spacing:.32em;color:#26292e}
.brand .rule{display:block;margin:14px 0 0;width:26px;height:2px;background:#1a1c1f;border:0;padding:0}
@media(max-width:640px){.brand{top:max(16px,env(safe-area-inset-top));left:18px}.brand .loreal{font-size:14px}.brand .title{font-size:30px;margin-top:11px}.brand .sub{font-size:11px;margin-top:8px}.brand .rule{margin-top:10px}}
@keyframes turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#world{transition:none}#loading{animation:none}}
</style>
</head>
<body>
<canvas id="world" tabindex="0" role="application" aria-label="四座 L Pro 护理场景建筑：居家护理、病房护理、养老院护理、头皮沙龙，拖拽旋转，点击进入" aria-describedby="instructions"></canvas>
<header class="brand" role="banner" aria-label="L'Oréal Paris L Pro 四场景小世界">
  <p class="loreal">L'ORÉAL</p>
  <p class="paris">PARIS</p>
  <h1 class="title">L Pro</h1>
  <p class="sub">四场景小世界</p>
  <span class="rule" aria-hidden="true"></span>
</header>
<div class="vignette" aria-hidden="true"></div>
<div id="loading" aria-hidden="true"></div>
<div id="fallback" hidden><p>这个页面需要 WebGL 支持，请换用较新的浏览器打开。</p></div>
<div class="hud-top">
  <button id="lang" class="chip chip-btn" type="button" aria-label="切换语言 / switch language">中文</button>
  <button id="pause" class="chip chip-btn" type="button" aria-pressed="false">⏸ Pause</button>
</div>
<p id="instructions" class="sr-only">四座 L Pro 护理场景建筑位于十字路口四周：居家护理、病房护理、养老院护理与头皮沙龙，每座建筑上方有白色标注胶囊。拖拽旋转视角，滚轮或双指缩放，点击白色标注或一座建筑进入对应场景页；方向键旋转视角，加号减号缩放，空格暂停动画，Esc 复位视角。</p>
<noscript><div style="position:absolute;inset:40% 15%;color:#3a4046;text-align:center">请启用 JavaScript 浏览四场景小世界。</div></noscript>
<script src="./index-bundle.js?v=25"></script>
<script>
/* bilingual UI (default EN, persisted in localStorage, shared with scene pages) */
(function () {
  var KEY = "lpro-lang";
  function get() { try { return localStorage.getItem(KEY) || "en"; } catch (e) { return "en"; } }
  function set(l) { try { localStorage.setItem(KEY, l); } catch (e) {} }
  var T = {
    en: {
      sub: "Four-Scene Mini World",
      title: "L Pro Four-Scene Mini World",
      desc: "L Pro four-scene mini world: Home Care, Ward Care, Senior Care and Scalp Salon miniature buildings — drag to rotate, click to enter each live scene.",
      canvasAria: "Four L Pro care-scene buildings: Home Care, Ward Care, Senior Care and Scalp Salon. Drag to rotate, click a pill or a building to enter.",
      brandAria: "L'Oréal Paris L Pro four-scene mini world",
      instructions: "Four L Pro care-scene buildings stand around the crossroads: Home Care, Ward Care, Senior Care and Scalp Salon, each with a white callout pill above. Drag to rotate, scroll or pinch to zoom, click a pill or a building to enter its scene; arrow keys rotate the view, space toggles the spin, Esc resets it."
    },
    zh: {
      sub: "四场景小世界",
      title: "L Pro 四场景小世界",
      desc: "L Pro 四场景小世界：居家护理、病房护理、养老院护理与头皮沙龙四座微缩建筑，可旋转查看，点击进入实况场景。",
      canvasAria: "四座 L Pro 护理场景建筑：居家护理、病房护理、养老院护理、头皮沙龙，拖拽旋转，点击进入",
      brandAria: "L'Oréal Paris L Pro 四场景小世界",
      instructions: "四座 L Pro 护理场景建筑位于十字路口四周：居家护理、病房护理、养老院护理与头皮沙龙，每座建筑上方有白色标注胶囊。拖拽旋转视角，滚轮或双指缩放，点击白色标注或一座建筑进入对应场景页；方向键旋转视角，加号减号缩放，空格暂停动画，Esc 复位视角。"
    }
  };
  var langBtn = document.getElementById("lang");
  function apply(l) {
    set(l);
    var t = T[l] || T.en;
    document.documentElement.lang = l === "en" ? "en" : "zh-CN";
    document.title = t.title;
    var m = document.querySelector('meta[name="description"]');
    if (m) m.setAttribute("content", t.desc);
    document.querySelector(".brand .sub").textContent = t.sub;
    document.getElementById("world").setAttribute("aria-label", t.canvasAria);
    document.querySelector(".brand").setAttribute("aria-label", t.brandAria);
    document.getElementById("instructions").textContent = t.instructions;
    langBtn.textContent = l === "en" ? "中文" : "EN";
    if (window.HWIndex && window.HWIndex.setLang) window.HWIndex.setLang(l);
  }
  langBtn.addEventListener("click", function () { apply(get() === "en" ? "zh" : "en"); });
  apply(get());

  window.HWIndex.start({ worlds: [
    { key: "home",   name: "居家护理",   nameEn: "Home Care",   desc: "便捷舒适 美发在家", descEn: "Salon-quality hair care at home", icon: "home",  href: "scene-home.html",   footprint: 11.2, yaw: 180 },
    { key: "ward",   name: "病房护理",   nameEn: "Ward Care",   desc: "温和配方 安心护理", descEn: "Gentle formula, worry-free care", icon: "cross", href: "scene-ward.html",   footprint: 11.2, yaw: 180 },
    { key: "garden", name: "养老院护理", nameEn: "Senior Care", desc: "温和清洁 呵护头皮", descEn: "Gentle cleanse, tender scalp care", icon: "face",  href: "scene-garden.html", footprint: 11.2, yaw: 180 },
    { key: "salon",  name: "头皮沙龙",   nameEn: "Scalp Salon", desc: "专业护理 深层净澈", descEn: "Professional care, deep & clean", icon: "salon", href: "scene-salon.html",  footprint: 11.2, yaw: 180 }
  ] });
})();
</script>
</body>
</html>
